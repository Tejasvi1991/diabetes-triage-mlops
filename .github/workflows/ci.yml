name: CI
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m training.train --version v0.1
      - run: pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: baseline-model-and-metrics
          path: |
            models/model.joblib
            models/metrics.json
