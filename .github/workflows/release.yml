name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: Train selected version
        run: python -m training.train --version "$GITHUB_REF_NAME"
      - run: python -m pytest -q
        env:
          MODEL_VERSION: ${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-model-and-metrics
          path: |
            models/model.joblib
            models/metrics.json
      - name: Set lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Build image
        run: docker build --build-arg MODEL_VERSION="$GITHUB_REF_NAME" -t "$IMAGE:$GITHUB_REF_NAME" .
      - name: Container smoke tests
        run: |
          docker run -d --name triage -p 80:80 "$IMAGE:$GITHUB_REF_NAME"
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:80/health >/dev/null; then break; fi
            sleep 1
          done
          python - <<'PY'
          import json, urllib.request, urllib.error, os
          base = 'http://localhost:80'
          health = json.load(urllib.request.urlopen(base + '/health'))
          assert health == {'status': 'ok', 'model_version': os.environ['GITHUB_REF_NAME']}
          p = dict(age=.02, sex=-.044, bmi=.06, bp=-.03, s1=-.02, s2=.03, s3=-.02, s4=.02, s5=.02, s6=-.001)
          def post(data):
              return urllib.request.urlopen(urllib.request.Request(base + '/predict', data=json.dumps(data).encode(), headers={'Content-Type':'application/json'}))
          assert isinstance(json.load(post(p))['prediction'], (int, float))
          del p['s6']
          try:
              post(p)
              raise AssertionError('Expected HTTP 422')
          except urllib.error.HTTPError as exc:
              assert exc.code == 422
              assert 's6' in exc.read().decode()
          PY
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker push "$IMAGE:$GITHUB_REF_NAME"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" models/metrics.json --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md
